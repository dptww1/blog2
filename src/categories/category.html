---
layout: post
title: Content for :prototype-term-titleize
prototype:
  collection: posts
  term: category
---

<ul>
  <% paginator.each do |r| %>
    <li class="post-summary">
      <a href="<%= r.relative_url %>"><b><%= r.data.title %></b></a> <span class="post-date"><%= r.date.to_s[0..9] %></span>
      <div><%= r.data.excerpt %></div>
    </li>
  <% end %>
</ul>
